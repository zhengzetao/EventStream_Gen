mechanism:
  chain:
    min_length: 4
    max_length: 12
  tree:
    min_nodes: 6
    max_nodes: 30
    max_depth: 6
    max_children_per_node: 3

stream:
  min_events: 5
  max_events: 80
  min_window: 10.0
  max_generation_retry: 5

background:
  density: medium
  rates:
    low: 0.05
    medium: 0.15
    high: 0.35
  density_ranges:
    low: [0.0, 0.55]
    medium: [0.0, 0.75]
    high: [0.0, 0.9]
  max_background_events: 60

temporal_policy:
  relation_defaults:
    direct_trigger:
      regimes:
        exponential: 0.5
        gamma: 0.5
    delayed_trigger:
      regimes:
        gamma: 0.4
        lognormal: 0.4
        weibull: 0.2
    weak_trigger:
      regimes:
        exponential: 0.3
        lognormal: 0.5
        weibull: 0.2
    recovery:
      regimes:
        gamma: 0.4
        lognormal: 0.4
        weibull: 0.2
  adjustments:
    bursty_scale_multiplier: 0.65
    depth_delay_multiplier: 0.08
    delayed_trigger_multiplier: 2.0
    weak_trigger_multiplier: 1.4
    recovery_multiplier: 2.5

regime_params:
  exponential:
    lambda: 1.0
  gamma:
    shape: 2.0
    scale: 0.8
  lognormal:
    mu: 0.2
    sigma: 0.5
  weibull:
    shape: 1.5
    scale: 1.0
